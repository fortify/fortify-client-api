plugins {
    id 'java-platform'
}

description = 'Bill Of Materials for fortify-client-api'

javaPlatform {
    allowDependencies()
}

dependencies {
		api platform('com.fasterxml.jackson:jackson-bom:2.22.4')
		api platform('org.glassfish.jersey:jersey-bom:3.1.8')
		api platform('org.apache.logging.log4j:log4j-bom:2.26.1')
		api platform('org.springframework:spring-framework-bom:7.0.10')
	constraints {
		api "org.apache.httpcomponents:httpcore:4.4.16"
		api "org.apache.httpcomponents:httpclient:4.5.14"
		api "jakarta.ws.rs:jakarta.ws.rs-api:3.1.0"
		api "org.glassfish.jersey.connectors:jersey-apache-connector:3.1.8"
		
		api "org.apache.commons:commons-lang3:3.21.0"
		api "commons-beanutils:commons-beanutils:1.10.0"
		api "commons-codec:commons-codec:1.20.0"
		api "org.apache.commons:commons-collections4:4.5.0"
		api "commons-logging:commons-logging:1.3.4"
		
		api "com.fortify.client.api:common-log:${project.version}"
		api "com.fortify.client.api:common-spring:${project.version}"
		api "com.fortify.client.api:common-rest:${project.version}"
		api "com.fortify.client.api:client-api-fod:${project.version}"
		api "com.fortify.client.api:client-api-ssc:${project.version}"
		api "com.fortify.client.api:client-api-webinspect:${project.version}"
		api "com.fortify.client.api:client-api-wie:${project.version}"
	}
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.javaPlatform
        }
    }
}