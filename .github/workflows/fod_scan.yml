on: 
  workflow_dispatch:
  push:
    branches: [main]

name: FoD scan  

jobs:
  FoD-SAST-Scan-And-Import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Check Out Source Code
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
      
      - name: Setup Java
        uses: fortify/shared-github/actions/3rdparty/actions/setup-java/v5@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Fortify AST Scan
        uses: fortify/github-action@v3.1.1
        env:
          FOD_URL: ${{ vars.OSS_FOD_BASE_URL }}
          FOD_TENANT: ${{ secrets.OSS_FOD_TENANT }}
          FOD_USER: ${{ secrets.OSS_FOD_USER }}
          FOD_PASSWORD: ${{ secrets.OSS_FOD_PAT }}
          FOD_RELEASE: ${{ secrets.OSS_FOD_RELEASE_ID }}
          DO_SETUP: 'false'
          PACKAGE_EXTRA_OPTS: '-bt gradle'
          SAST_EXPORT_EXTRA_OPTS: '--type=sarif'